<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
    <defs>
        <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#149c80" />
            <stop offset="45%" stop-color="#02cca4" />
            <stop offset="100%" stop-color="#00f4ff" />
        </linearGradient>
    </defs>
    
    <!-- Rectángulo redondeado inferior izquierdo -->
    <rect x="90" y="325" width="67" height="130" rx="22" ry="22" fill="url(#logoGradient)" />
    
    <!-- Letra M estilizada con trazo grueso y uniones redondeadas -->
    <path d="M 124,142 L 250,296 L 376,142 L 376,424" 
          fill="none" 
          stroke="url(#logoGradient)" 
          stroke-width="67" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
</svg>
